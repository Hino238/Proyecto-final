<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Movil - Robot 6 DOF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        body { 
            overflow-x: hidden; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        } 
        
        .btn-tactil { padding: 12px 20px; font-size: 1.2rem; font-weight: bold; }
        .macro-card { cursor: pointer; transition: transform 0.2s; }
        
        .joystick-zone {
            width: 100%;
            height: 180px;
            position: relative;
            background-color: #21252b;
            border-radius: 10px;
            border: 1px solid #3d4450;
            touch-action: none; 
        }
    </style>
</head>
<body>
    <nav class="navbar mb-3 px-3 border-bottom border-secondary" style="background-color: #161b22;">
        <span class="navbar-brand text-light fw-bold fs-5">Control Joystick 6 DOF</span>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Salir</a>
    </nav>

    <div class="container-fluid px-3">
        <div class="row g-3">
            
            <div class="col-12 col-md-5">
                
                <div class="card p-3 shadow-sm mb-3 border-info">
                    <h5 class="text-info mb-2 fs-6 fw-bold">POSES DE TRABAJO</h5>
                    <div class="row g-2">
                        <div class="col-6"><button class="btn btn-outline-info w-100 py-2 fw-bold small" onclick="ejecutarMacro('home')">HOME</button></div>
                        <div class="col-6"><button class="btn btn-outline-warning w-100 py-2 fw-bold text-dark small" onclick="ejecutarMacro('recoger')">RECOGER</button></div>
                    </div>
                </div>

                <div class="card p-3 shadow-sm mb-3 border-warning">
                    <h5 class="text-warning mb-3 fs-6 fw-bold">TELEOPERACION</h5>
                    
                    <div class="row g-2 mb-3">
                        <div class="col-6 text-center">
                            <span class="small text-light fw-bold">BASE / HOMBRO</span>
                            <div id="zone_joystick_left" class="joystick-zone mt-1"></div>
                        </div>
                        <div class="col-6 text-center">
                            <span class="small text-light fw-bold">MUNECA / CODO</span>
                            <div id="zone_joystick_right" class="joystick-zone mt-1"></div>
                        </div>
                    </div>

                    <div class="mt-2">
                        <div class="text-center mb-1"><span class="small text-light fw-bold">ROTACION MUNECA</span></div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-dark border-secondary text-light w-50 py-2 fw-bold" onclick="ajustarArticulacion(4, -15)">IZQUIERDA</button>
                            <button class="btn btn-dark border-secondary text-light w-50 py-2 fw-bold" onclick="ajustarArticulacion(4, 15)">DERECHA</button>
                        </div>
                    </div>

                    <div class="mt-3">
                        <div class="text-center mb-1"><span class="small text-light fw-bold">GARRA</span></div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-danger w-50 py-3 fw-bold fs-5 btn-tactil" onclick="accionPinza('abrir')">ABRIR</button>
                            <button class="btn btn-success w-50 py-3 fw-bold fs-5 btn-tactil" onclick="accionPinza('cerrar')">AGARRAR</button>
                        </div>
                    </div>
                </div>

                <div class="card p-3 shadow-sm mb-3 border-success">
                    <h5 class="text-success mb-2 fs-6 fw-bold">SECUENCIADOR</h5>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="small text-light">Pasos: <span id="contadorPaso" class="badge bg-success">0</span></span>
                        <button class="btn btn-outline-danger btn-sm py-0" onclick="borrarRutina()">Limpiar</button>
                    </div>
                    <div class="row g-2">
                        <div class="col-12"><button class="btn btn-outline-light w-100 fw-bold btn-sm py-2" onclick="guardarPaso()">GRABAR POSTURA</button></div>
                        <div class="col-6"><button id="btnReproducir" class="btn btn-success w-100 btn-sm py-2 fw-bold" onclick="reproducirRutina(false)">ONCE</button></div>
                        <div class="col-6"><button id="btnBucle" class="btn btn-warning text-dark w-100 btn-sm py-2 fw-bold" onclick="reproducirRutina(true)">LOOP</button></div>
                    </div>
                </div>

            </div>

            <div class="col-12 col-md-7">
                <div class="card p-3 h-100">
                    <div class="d-flex justify-content-between">
                        <h5 class="text-info mb-2 fs-6 fw-bold">SIMULACION VIRTUAL</h5>
                        <div id="lecturas-grados" class="small text-muted text-end"></div>
                    </div>
                    <div id="canvas3d" style="min-height: 300px;"></div>
                </div>
            </div>

        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
