<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Robot 6 DOF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; height: 100vh; display: flex; align-items: center; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 15px; width: 100%; max-width: 400px; margin: auto; }
        .form-control { background-color: #2c2c2c; border: 1px solid #444; color: white; }
        .form-control:focus { background-color: #333; color: white; border-color: #0dcaf0; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-lg p-4">
            <div class="text-center mb-4">
                <h4 class="text-info fw-bold text-uppercase">Brazo Robótico 6 DOF</h4>
                <p class="text-secondary small">Panel de Control</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger py-2 px-3 small text-center">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Usuario</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-info text-dark w-100 fw-bold py-2">INGRESAR AL PANEL</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted" style="font-size: 0.75rem;">Servidor</span>
            </div>
        </div>
    </div>
</body>
</html>
